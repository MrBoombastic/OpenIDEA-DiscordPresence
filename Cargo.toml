[package]
name = "openidea-plugin-mrboombastic-discord-presence"
version = "1.0.0"
edition = "2024"
publish = false

# A plugin builds on its own (target wasm32-wasip2), outside any workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", tag = "v0.1.40" }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
